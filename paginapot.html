<!DOCTYPE html >
<html>  
    <head>  
        <title>POTENCIOMETRO</title>
        <style>
            body {font-family: sans-serif;text-align: center;margin: 50px;}
            h1 {color: cornflowerblue;}
            #potValue {font-size: 24PX;color: blue;}
        </style>
    </head>
    <body>
        <h1>Lectura del Potenciómetro</h1>
        <p>Valor actual:</p>
        <p id="potValue">---</p>

        <script>
            function updatePot() {
                fetch('/pot')
                    .then(response => response.text())
                    .then(data => document.getElementById('potValue').innerText = data)
                    }
                    setInterval(updatePot, 1000); 
        </script>
    </body>
</html>
